<!DOCTYPE html>
<html>
<head>
    <title>Two Tables</title>
    <style>
        table {
            
            border-collapse: collapse;
            margin: 20px auto;
            text-align: center;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<!-- Table 1 -->
<table>
    <tr>
        <th colspan="4">TITLE</th>
    </tr>
    <tr>
        <th colspan="2">subtitle</th>
        <th colspan="2">subtitle</th>
    </tr>
    <tr>
        <td>1 item</td>
        <td>123</td>
        <td>1 item</td>
        <td>123</td>
    </tr>
    <tr>
        <td>1 item</td>
        <td>123</td>
        <td>1 item</td>
        <td>123</td>
    </tr>
    <tr>
        <td>1 item</td>
        <td>123</td>
        <td>1 item</td>
        <td>123</td>
    </tr>
    <tr>
        <td colspan="2">sub subtitle</td>
        <td colspan="2">sub subtitle</td>
    </tr>
</table>

<!-- Table 2 -->
<table>
    <tr>
        <th rowspan="2">Subject</th>
        <th rowspan="2"></th>
        <th colspan="2">Students</th>
    </tr>
    <tr>
        <th>John Doe</th>
        <th>Miriam Luther</th>
    </tr>

    <tr>
        <td rowspan="2">Biology</td>
        <td>Practical</td>
        <td>A</td>
        <td>A</td>
    </tr>
    <tr>
        <td>Theory</td>
        <td>A+</td>
        <td>A</td>
    </tr>

    <tr>
        <td rowspan="2">Chemistry</td>
        <td>Practical</td>
        <td>B</td>
        <td>C</td>
    </tr>
    <tr>
        <td>Theory</td>
        <td>A</td>
        <td>C+</td>
    </tr>

    <tr>
        <td rowspan="2">Physics</td>
        <td>Practical</td>
        <td>A</td>
        <td>A</td>
    </tr>
    <tr>
        <td>Theory</td>
        <td>A-</td>
        <td>A-</td>
    </tr>
</table>

</body>
</html>
